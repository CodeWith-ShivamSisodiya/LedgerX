name: Android device and migration tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: android-device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Android device tests (API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Install SDK and compile instrumentation tests
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::KVM not available; emulator may be extremely slow"
          fi

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb logcat -c || true
            set +e
            gradle --no-daemon --stacktrace connectedDebugAndroidTest
            test_exit_code=$?
            adb logcat -d -v time > android-test-logcat.txt || true
            grep -E -A 35 'FATAL EXCEPTION|AndroidRuntime|INSTRUMENTATION_FAILED|Process crashed' android-test-logcat.txt || true
            exit "$test_exit_code"

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerx-device-test-reports-${{ github.run_number }}
          path: |
            android-test-logcat.txt
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
